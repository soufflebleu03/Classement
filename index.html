<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Souffle Bleu — Classement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060D1F; --panel:#0D1A38; --line:rgba(255,255,255,.15);
    --text:#FFFFFF; --muted:rgba(255,255,255,.62); --accent:#4FA8FF;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Barlow',sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{max-width:640px;margin:0 auto;padding:22px 18px 48px;display:flex;flex-direction:column;gap:18px}
  h1{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:2px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:14px;margin:0}
  .canvas-wrap{width:100%;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000}
  canvas{display:block;width:100%;height:auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
  label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  input[type=text],input[type=number]{
    width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
    background:#0A1730;color:var(--text);font-size:16px;font-family:inherit;
  }
  .rows{display:flex;flex-direction:column;gap:6px}
  .rowhead{
    display:grid;grid-template-columns:28px 1fr 56px 72px;gap:6px;
    font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:0 4px;
  }
  .teamrow{
    display:grid;grid-template-columns:28px 1fr 56px 72px;gap:6px;align-items:center;
  }
  .teamrow .num{color:var(--muted);font-size:13px;text-align:center}
  .teamrow input{padding:9px 8px;font-size:14px}
  .teamrow input.team{text-align:left}
  .teamrow input.mj,.teamrow input.vd{text-align:center}
  .download{
    width:100%;padding:16px;border-radius:12px;border:none;
    background:var(--accent);color:#06152F;font-family:'Anton',sans-serif;
    font-size:18px;letter-spacing:2px;cursor:pointer;
  }
  .status{font-size:13px;color:var(--muted);text-align:center;min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>SOUFFLE BLEU — CLASSEMENT</h1>
    <p class="sub">Remplis la journée puis les équipes dans l'ordre du classement (jusqu'à 20).</p>
  </div>

  <div class="canvas-wrap"><canvas id="cv" width="1080" height="1350"></canvas></div>

  <div class="panel">
    <div>
      <label for="journee">Journée</label>
      <input type="text" id="journee" value="Journée 5">
    </div>

    <div>
      <label>Équipes</label>
      <div class="rowhead"><div></div><div>Équipe</div><div>MJ</div><div>V-D</div></div>
      <div class="rows" id="rows"></div>
    </div>

    <button class="download" id="dl">Télécharger le visuel</button>
    <div class="status" id="status"></div>
  </div>
</div>

      ctx.font = "18px 'Anton'";
      ctx.fillStyle = isVichy ? '#6FE3FF' : '#FFFFFF';
      ctx.fillText(t.vd || '–', colVD, cy);
    });

    ctx.textAlign='center';
    drawFlameIcon(W/2,H-40,26);
    ctx.font = "13px 'Anton'";
    ctx.fillStyle='rgba(255,255,255,0.55)';
    ctx.fillText('LE SOUFFLE BLEU', W/2, H-14);
  }

  let downloadsCap = null;
  if(typeof claude !== 'undefined' && claude.use){
    try { downloadsCap = await claude.use('downloads'); } catch(e){}
  }

  document.getElementById('dl').addEventListener('click', function(){
    const statusEl = document.getElementById('status');
    statusEl.textContent = 'Préparation…';
    cv.toBlob(async function(blob){
      if(!blob){ statusEl.textContent = 'Erreur de génération.'; return; }
      const filename = 'souffle-bleu-classement.png';
      if(downloadsCap){
        try{
          const res = await downloadsCap.save({filename: filename, data: blob});
          statusEl.textContent = res.status==='saved' ? 'Visuel enregistré.' : 'Visuel transmis.';
        } catch(err){
          statusEl.textContent = (err && err.code==='declined') ? '' : 'Le téléchargement a échoué.';
        }
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      statusEl.textContent = 'Visuel téléchargé.';
    }, 'image/png');
  });

  renderRows();
  if(document.fonts && document.fonts.ready){
    document.fonts.load("20px 'Anton'");
    document.fonts.load("20px 'Barlow'");
    document.fonts.ready.then(draw);
  }
  draw();
})();
</script>
</body>
</html>
